<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PropIQ — AI Real Estate Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet"/>
<style>
/* ── Reset ── */
*,::before,::after{box-sizing:border-box}
*{margin:0;padding:0}
html{line-height:1.5;-webkit-text-size-adjust:100%}
body{font-family:'DM Sans',sans-serif;background:#020812;color:#e2e8f0;min-height:100vh}
button{cursor:pointer;font-family:inherit}
input{font-family:inherit}
a{color:inherit;text-decoration:none}
img,svg{display:block}
table{border-collapse:collapse}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:#060f1e}
::-webkit-scrollbar-thumb{background:#1a3050;border-radius:2px}

/* ── NAV ── */
#nav-row1{
  position:sticky;top:0;z-index:50;
  background:#030c18;border-bottom:1px solid #0d1e30;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;height:52px;
}
#nav-row2{
  position:sticky;top:52px;z-index:49;
  background:#030c18;border-bottom:1px solid #0d1e30;
  display:flex;align-items:center;gap:8px;
  padding:8px 16px;overflow-x:auto;
}
#nav-row3{
  position:sticky;top:96px;z-index:48;
  background:#020d1a;border-bottom:1px solid #0d1e30;
  display:flex;overflow-x:auto;
}
#nav-row2::-webkit-scrollbar,#nav-row3::-webkit-scrollbar{height:0}

/* Logo */
.logo{display:flex;align-items:center;gap:8px}
.logo-icon{
  width:28px;height:28px;border-radius:7px;
  background:linear-gradient(135deg,#22d3a0,#0ea5e9);
  display:flex;align-items:center;justify-content:center;font-size:14px;
}
.logo-text{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:0.08em;color:#fff}
.logo-sub{font-family:'DM Mono',monospace;font-size:9px;color:#1a3050;letter-spacing:0.1em}

/* ZIP input */
.zip-wrap{display:flex;gap:6px}
#zip-input{
  width:64px;background:#0f1e30;border:1px solid #1e3a50;
  color:#e2e8f0;font-size:13px;padding:6px 8px;
  border-radius:6px;font-family:'DM Mono',monospace;outline:none;
}
#zip-input::placeholder{color:#3a6080}
#zip-input:focus{border-color:#22d3a0}
.zip-add{
  width:32px;height:32px;border-radius:6px;border:none;
  background:linear-gradient(135deg,#0ea5e9,#22d3a0);
  color:#000;font-size:20px;font-weight:900;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}

/* Strategy pills */
.strat-label{font-family:'DM Mono',monospace;font-size:9px;color:#1a3050;letter-spacing:0.1em;flex-shrink:0}
.strat-btn{
  flex-shrink:0;background:#0a1525;border:1px solid #1a2a40;
  color:#3a6080;font-family:'DM Mono',monospace;font-size:11px;
  font-weight:700;padding:5px 12px;border-radius:6px;
  transition:all .15s;white-space:nowrap;
}
.strat-btn.active{background:#0a2a18;border-color:#22d3a0;color:#22d3a0}
.strat-btn:hover:not(.active){border-color:#2a5070;color:#7ab8e0}

/* Tab bar */
.tab-btn{
  flex-shrink:0;background:transparent;border:none;
  border-bottom:2px solid transparent;
  color:#2a4060;font-family:'DM Mono',monospace;font-size:11px;
  font-weight:700;padding:12px 18px;letter-spacing:0.06em;
  white-space:nowrap;transition:all .15s;margin-bottom:-1px;
}
.tab-btn.active{border-bottom-color:#38bdf8;color:#38bdf8}
.tab-btn:hover:not(.active){color:#4a7090}

/* ── CARDS ── */
.card{background:#060f1e;border:1px solid #132030;border-radius:14px;padding:20px}
.card-sm{background:#090f1e;border:1px solid #121e30;border-radius:10px;padding:14px 16px}
.section-label{font-family:'DM Mono',monospace;font-size:9px;color:#2a4060;letter-spacing:0.18em;margin-bottom:12px;text-transform:uppercase}

/* ── TILES ── */
.tile{flex:1;min-width:110px;padding:14px 16px;border-radius:10px;background:#0a1525;border:1px solid #132030}
.tile.green{background:linear-gradient(135deg,#071a10,#04120a);border-color:#1a4a35}
.tile-label{font-family:'DM Mono',monospace;font-size:9px;color:#2a4060;letter-spacing:0.1em;margin-bottom:5px}
.tile-value{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#e2e8f0;line-height:1}
.tile.green .tile-value{color:#22d3a0}
.tile-sub{font-family:'DM Mono',monospace;font-size:9px;color:#1e3050;margin-top:4px}

/* ── SCORE BARS ── */
.sbar-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #0d1a28}
.sbar-label{width:140px;font-family:'DM Mono',monospace;font-size:11px;color:#4a6080;flex-shrink:0}
.sbar-track{flex:1;height:5px;background:#0d1a28;border-radius:3px;overflow:hidden}
.sbar-fill{height:100%;border-radius:3px;transition:width 1.1s ease}
.sbar-score{width:32px;text-align:right;font-family:'DM Mono',monospace;font-size:13px;font-weight:700;flex-shrink:0}
.sbar-wt{width:28px;text-align:right;font-family:'DM Mono',monospace;font-size:9px;color:#1e3050;flex-shrink:0}

/* ── GAUGE ── */
.gauge-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0}
.gauge-ring{transition:stroke-dasharray 1.2s ease}
.gauge-score{font-family:'Bebas Neue',sans-serif;font-size:20px;line-height:1}
.gauge-denom{font-family:'DM Mono',monospace;font-size:8px;color:#3a5070;margin-top:1px}
.gauge-label{font-family:'DM Mono',monospace;font-size:10px;font-weight:700;letter-spacing:0.15em}

/* ── ZIP RANKINGS ── */
.zip-row{
  display:flex;align-items:center;gap:8px;padding:10px 12px;
  border-radius:10px;cursor:pointer;transition:all .15s;
  background:#090f1e;border:1px solid #121e30;
}
.zip-row.active{background:#0a1f35;border-color:#1e4060}
.zip-row:hover:not(.active){background:#0d1e30}
.rank-badge{
  width:22px;height:22px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-family:'DM Mono',monospace;font-size:9px;font-weight:800;
}
.zip-name{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:0.04em}
.zip-score{font-family:'Bebas Neue',sans-serif;font-size:15px}
.zip-remove{background:none;border:none;color:#1e3050;font-size:16px;padding:0;margin-left:2px}

/* ── DISCOVER ── */
.hero{
  background:linear-gradient(135deg,#050e1c,#020812);
  border:1px solid #132030;border-radius:16px;
  padding:48px 32px;text-align:center;position:relative;overflow:hidden;
}
/* NO grid background - removed */
.hero-eyebrow{font-family:'DM Mono',monospace;font-size:10px;color:#1a4060;letter-spacing:0.2em;margin-bottom:12px}
.hero-title{font-family:'Bebas Neue',sans-serif;font-size:48px;letter-spacing:0.05em;color:#fff;margin-bottom:12px;line-height:1}
.hero-sub{font-size:14px;color:#3a5570;max-width:460px;margin:0 auto 28px;line-height:1.8}
.hero-sub strong{color:#38bdf8}
.hero-sub strong.green{color:#22d3a0}
.discover-btn{
  font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:0.14em;
  padding:14px 48px;border-radius:10px;border:none;
  background:linear-gradient(135deg,#0ea5e9,#22d3a0);
  color:#000;font-weight:800;cursor:pointer;transition:all .2s;
}
.discover-btn.loading{background:#0a1525;border:1px solid #1a3050;color:#2a4060;cursor:not-allowed}

/* Stream box */
.stream-box{background:#060f1e;border:1px solid #132030;border-radius:12px;padding:18px 20px;display:none}
.stream-text{font-family:'DM Mono',monospace;font-size:11px;color:#2a5070;line-height:1.9;word-break:break-all}
.cursor-blink{display:inline-block;width:7px;height:12px;background:#38bdf8;margin-left:2px;vertical-align:middle;animation:blink .8s step-end infinite}

/* ZIP result cards */
.zip-card{border-radius:14px;padding:20px 22px;position:relative;overflow:hidden;animation:fadeIn .3s ease forwards}
.zip-card-bar{position:absolute;top:0;left:0;right:0;height:3px}
.zip-card-zip{font-family:'Bebas Neue',sans-serif;font-size:30px;color:#fff;letter-spacing:0.04em;line-height:1}
.zip-card-city{font-family:'DM Mono',monospace;font-size:11px;color:#3a6080;margin-left:6px}
.zip-card-thesis{font-size:12px;color:#5a8090;line-height:1.7;margin:10px 0}
.signal-pill{font-family:'DM Mono',monospace;font-size:10px;padding:3px 9px;border-radius:20px;background:#061812;border:1px solid #1a4a35;color:#22d3a0}
.risk-flag{font-family:'DM Mono',monospace;font-size:11px;color:#d97706;margin:8px 0}
.analyze-btn{
  width:100%;font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:0.1em;
  padding:9px 0;border-radius:8px;border:none;
  background:linear-gradient(135deg,#0ea5e9,#22d3a0);color:#000;font-weight:800;cursor:pointer;
}
.load-all-btn{
  width:100%;background:#0a1525;border:1px solid #1a3a5a;color:#38bdf8;
  font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:0.12em;
  padding:14px 0;border-radius:10px;cursor:pointer;
}

/* ── CASH FLOW ── */
.cf-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #0d1a28;font-size:12px}
.cf-label{font-family:'DM Mono',monospace;color:#3a6080}
.cf-value{font-family:'DM Mono',monospace;font-weight:700}
.cf-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding-top:12px;margin-top:4px;border-top:1px solid #0d1a28}
.cf-metric-label{font-family:'DM Mono',monospace;font-size:8px;color:#2a4060;letter-spacing:0.1em;margin-bottom:3px;text-align:center}
.cf-metric-value{font-family:'Bebas Neue',sans-serif;font-size:18px;text-align:center}

/* ── DATA TAB ── */
.fetch-card{background:#090f1e;border:1px solid #121e30;border-radius:11px;padding:16px 18px;margin-bottom:10px}
.fetch-progress{height:3px;background:#0d1a28;border-radius:2px;overflow:hidden;margin-top:12px;display:none}
.fetch-progress-bar{height:100%;width:60%;background:linear-gradient(90deg,#0ea5e9,#22d3a0);border-radius:2px;animation:progressSlide 1.4s linear infinite}
.upload-zone{border:1px dashed #1a3050;border-radius:10px;padding:14px 18px;cursor:pointer;transition:border-color .2s;display:flex;align-items:center;gap:12px}
.upload-zone:hover{border-color:#38bdf8}

/* ── API TAB ── */
.health-row{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid #0d1a28}
.health-row:last-child{border-bottom:none}
.health-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;transition:all .3s}
.health-name{font-size:13px;font-weight:600;color:#e2e8f0}
.health-desc{font-size:11px;color:#3a6080;margin-top:2px}
.health-msg{font-family:'DM Mono',monospace;font-size:10px;margin-top:3px}
.status-badge{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.1em;padding:3px 8px;border-radius:5px;white-space:nowrap;flex-shrink:0}
.test-btn{flex-shrink:0;background:#090f1e;border:1px solid #1a2a40;color:#38bdf8;font-family:'DM Mono',monospace;font-size:10px;padding:5px 12px;border-radius:6px;cursor:pointer;white-space:nowrap}
.key-card{background:#090f1e;border:1px solid #121e30;border-radius:10px;padding:14px 16px;margin-bottom:10px}
.key-label-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.key-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.key-name{font-size:13px;font-weight:600;color:#e2e8f0;flex:1}
.key-limit{font-family:'DM Mono',monospace;font-size:9px;color:#2a4060}
.key-link{font-family:'DM Mono',monospace;font-size:10px;color:#38bdf8}
.key-input{
  width:100%;background:#060f1e;border:1px solid #1a3050;
  color:#22d3a0;font-family:'DM Mono',monospace;font-size:12px;
  padding:9px 12px;border-radius:7px;outline:none;
}
.key-input:focus{border-color:#22d3a0}
.guide-row{display:flex;align-items:flex-start;gap:14px;padding:14px 18px;border-top:1px solid #0d1a28}
.guide-bar{width:3px;border-radius:2px;flex-shrink:0;align-self:stretch;min-height:20px}
.guide-name{font-size:13px;font-weight:600;color:#e2e8f0;margin-bottom:3px}
.guide-status{font-family:'DM Mono',monospace;font-size:9px;padding:2px 7px;border-radius:4px}
.guide-feeds{font-size:11px;color:#3a6080;line-height:1.6;flex:1}
.guide-limit{font-family:'DM Mono',monospace;font-size:10px;color:#2a4060;white-space:nowrap;flex-shrink:0;margin-top:2px}

/* ── SOURCE BADGE ── */
.src-badge{font-family:'DM Mono',monospace;font-size:9px;padding:2px 6px;border-radius:4px}

/* ── ERROR / EMPTY ── */
.empty-state{background:#060f1e;border:1px dashed #132030;border-radius:16px;padding:64px 32px;text-align:center}
.error-box{background:#180808;border:1px solid #4a1515;border-radius:12px;padding:16px 20px;color:#f87171;font-family:'DM Mono',monospace;font-size:12px;display:none}

/* ── HEADER DETAIL ── */
.detail-header{background:linear-gradient(135deg,#060f1e,#071520);border:1px solid #132030;border-radius:14px;padding:22px 24px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.detail-zip{font-family:'Bebas Neue',sans-serif;font-size:46px;letter-spacing:0.04em;color:#fff;line-height:1}
.detail-name{font-family:'DM Mono',monospace;font-size:12px;color:#3a6080;margin-top:4px}
.detail-meta{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap}
.detail-meta span{font-family:'DM Mono',monospace;font-size:11px;color:#2a5070}
.detail-meta strong{font-weight:600}

/* ── GRID LAYOUTS ── */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tiles-5{display:flex;gap:8px;flex-wrap:wrap}
.tiles-4{display:flex;gap:8px;flex-wrap:wrap}

/* ── TABLE ── */
.data-table{width:100%;border-collapse:collapse;font-family:'DM Mono',monospace;font-size:11px}
.data-table th{text-align:left;padding:7px 10px;color:#2a4060;border-bottom:1px solid #132030;white-space:nowrap;font-weight:500}
.data-table td{padding:6px 10px;color:#3a6080;white-space:nowrap;border-bottom:1px solid #090f1e}

/* ── PAGE ── */
#page{padding:20px 16px;max-width:900px;margin:0 auto}

/* ── ANIMATIONS ── */
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes progressSlide{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
.fade-in{animation:fadeIn .3s ease forwards}

/* ── RESPONSIVE ── */
@media(max-width:640px){
  .two-col{grid-template-columns:1fr}
  .detail-zip{font-size:36px}
  #analyze-layout{flex-direction:column}
  #rankings-col{width:100%}
}
</style>
</head>
<body>

<!-- ══════════════════════════════════════════
     NAV
══════════════════════════════════════════ -->
<div id="nav-row1">
  <div class="logo">
    <div class="logo-icon">&#11041;</div>
    <span class="logo-text">PROPIQ</span>
    <span class="logo-sub">AI</span>
  </div>
  <div class="zip-wrap">
    <input id="zip-input" type="text" maxlength="5" placeholder="ZIP code"
      oninput="this.value=this.value.replace(/\D/g,'')"
      onkeydown="if(event.key==='Enter')doAddZip()"/>
    <button class="zip-add" onclick="doAddZip()">+</button>
  </div>
</div>

<div id="nav-row2">
  <span class="strat-label">STRATEGY</span>
  <button class="strat-btn active" data-s="Buy &amp; Hold"  onclick="setStrategy(this)">Buy &amp; Hold</button>
  <button class="strat-btn"        data-s="BRRRR"           onclick="setStrategy(this)">BRRRR</button>
  <button class="strat-btn"        data-s="Fix &amp; Flip"  onclick="setStrategy(this)">Fix &amp; Flip</button>
  <button class="strat-btn"        data-s="Wholesale"       onclick="setStrategy(this)">Wholesale</button>
</div>

<div id="nav-row3">
  <button class="tab-btn active" data-tab="discover" onclick="setTab(this)">&#9889; DISCOVER</button>
  <button class="tab-btn"        data-tab="analyze"  onclick="setTab(this)" id="tab-analyze">&#128202; ANALYZE</button>
  <button class="tab-btn"        data-tab="data"     onclick="setTab(this)" id="tab-data">&#128193; DATA</button>
  <button class="tab-btn"        data-tab="api"      onclick="setTab(this)">&#9881; API &amp; HEALTH</button>
</div>

<!-- ══════════════════════════════════════════
     PAGE CONTENT
══════════════════════════════════════════ -->
<div id="page"></div>

<script>
// ════════════════════════════════════════════
// CONSTANTS
// ════════════════════════════════════════════
const SW = {
  'Buy & Hold': {appreciation:.25,cashflow:.35,liquidity:.15,demand:.15,supply:.10},
  'BRRRR':      {appreciation:.30,cashflow:.30,liquidity:.15,demand:.15,supply:.10},
  'Fix & Flip': {appreciation:.40,cashflow:.10,liquidity:.30,demand:.10,supply:.10},
  'Wholesale':  {appreciation:.20,cashflow:.10,liquidity:.40,demand:.20,supply:.10},
};

const KEYS = {
  fred:     '980ec69f10cd51ef9eadbeb12b6e6467',
  rentcast: '2ec38dc7a17c4cff9a6aa31eb8d1e5b2',
  census:   'f47bebd1c416c39d731f7e329b9365b3de5a74e9',
};

// CORS proxies — tried in order
const PROXIES = [
  url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
  url => `https://cors-anywhere.herokuapp.com/${url}`,
];

// ════════════════════════════════════════════
// APP STATE
// ════════════════════════════════════════════
const S = {
  tab:      'discover',
  strategy: 'Buy & Hold',
  zips:     [],
  results:  {},
  loading:  {},
  active:   null,
  discoverResult: null,
  redfinData: null,
  redfinFile: null,
  health:   {},
  testing:  {},
};

// ════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════
const fmt = (n,pre='',suf='') => n&&n>0 ? `${pre}${Number(n).toLocaleString()}${suf}` : '--';
const sc  = s => s>=7.5?'#22d3a0':s>=5?'#fbbf24':'#f87171';
const scL = s => s>=7.5?'STRONG BUY':s>=5?'MODERATE':'AVOID';
const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function mockData(zip) {
  const seed = zip.split('').reduce((a,c)=>a+c.charCodeAt(0),0);
  const rng = (mn,mx,s=7919) => mn+((seed*s+6271)%9973)/9973*(mx-mn);
  return {
    census:{
      name:`ZIP ${zip}`,
      medianIncome:   Math.round(rng(42000,118000)),
      medianRent:     Math.round(rng(850,3100)),
      medianHomeValue:Math.round(rng(140000,720000)),
      totalOccupied:  Math.round(rng(6000,52000)),
      ownerOccupied:  Math.round(rng(3000,32000)),
      renterOccupied: Math.round(rng(2500,22000)),
      vacantUnits:    Math.round(rng(150,5000)),
      totalPopulation:Math.round(rng(14000,110000)),
    },
    rentcast:{
      averageRent:     Math.round(rng(850,3100)),
      averageRentYoY:  parseFloat(rng(0.5,11,3571).toFixed(1)),
      daysOnMarket:    Math.round(rng(8,85,3571)),
      averageSalePrice:Math.round(rng(145000,725000)),
    },
    fredMortgage:6.82,
    fredHPI:[
      {date:'Jan 24',value:Math.round(rng(280,340)*10)/10},
      {date:'Apr 24',value:Math.round(rng(285,352)*10)/10},
      {date:'Jul 24',value:Math.round(rng(290,362)*10)/10},
      {date:'Oct 24',value:Math.round(rng(293,370)*10)/10},
      {date:'Jan 25',value:Math.round(rng(296,378)*10)/10},
    ],
  };
}

function scoreMarket(d, strategy) {
  const {census,rentcast,fredMortgage} = d;
  const w = SW[strategy];
  let appreciation=5, cashflow=5, liquidity=5, demand=5, supply=5;

  if(census.medianHomeValue>0)
    appreciation = Math.min(10,Math.max(0,((census.medianRent*12)/census.medianHomeValue)*100));
  if(rentcast?.averageRentYoY) appreciation=Math.min(10,appreciation+rentcast.averageRentYoY/2);

  if(census.medianHomeValue>0&&fredMortgage>0&&census.medianRent>0){
    const loan=census.medianHomeValue*.8, mr=fredMortgage/100/12;
    const piti=loan*(mr*Math.pow(1+mr,360))/(Math.pow(1+mr,360)-1)*1.25;
    cashflow=Math.min(10,Math.max(0,(census.medianRent*.95-piti+500)/110));
  }

  if(rentcast?.daysOnMarket) liquidity=Math.min(10,Math.max(1,10-(rentcast.daysOnMarket-20)*.1));

  if(census.medianIncome>0){
    demand=Math.min(10,Math.max(1,12-((census.medianRent*12)/census.medianIncome)*20));
    demand=Math.min(10,demand+(census.renterOccupied/(census.totalOccupied||1))*2);
  }

  if(census.vacantUnits>0&&census.totalOccupied>0)
    supply=Math.min(10,Math.max(1,11-(census.vacantUnits/(census.totalOccupied+census.vacantUnits))*60));

  const scores={appreciation,cashflow,liquidity,demand,supply};
  const composite=Object.entries(w).reduce((s,[k,wt])=>s+scores[k]*wt,0);
  return {scores,composite,weights:w};
}

// API FETCHERS — with CORS proxy fallback
// ════════════════════════════════════════════
async function fetchWithProxy(url, opts={}) {
  // Try direct first
  try {
    const r = await fetch(url, opts);
    if(r.ok) return r;
  } catch {}
  // Try proxies (for non-credentialed gets only)
  if(opts.method && opts.method !== 'GET') throw new Error('CORS blocked');
  for(const proxy of PROXIES) {
    try {
      const r = await fetch(proxy(url));
      if(r.ok) return r;
    } catch {}
  }
  throw new Error('All proxies failed');
}

async function fetchCensus(zip) {
  const vars=['B19013_001E','B25064_001E','B25077_001E','B01003_001E',
              'B25003_001E','B25003_002E','B25003_003E','B25002_003E','NAME'].join(',');
  const url=`https://api.census.gov/data/2022/acs/acs5?get=${vars}&for=zip%20code%20tabulation%20area:${zip}&key=${KEYS.census}`;
  // Census supports CORS directly
  const res=await fetch(url);
  if(!res.ok) throw new Error(`Census ${res.status}`);
  const [headers,values]=await res.json();
  const d={};
  headers.forEach((h,i)=>{d[h]=values[i];});
  return {
    name:           d['NAME']||`ZIP ${zip}`,
    medianIncome:   Math.max(0,parseInt(d['B19013_001E'])||0),
    medianRent:     Math.max(0,parseInt(d['B25064_001E'])||0),
    medianHomeValue:Math.max(0,parseInt(d['B25077_001E'])||0),
    totalPopulation:Math.max(0,parseInt(d['B01003_001E'])||0),
    totalOccupied:  Math.max(0,parseInt(d['B25003_001E'])||0),
    ownerOccupied:  Math.max(0,parseInt(d['B25003_002E'])||0),
    renterOccupied: Math.max(0,parseInt(d['B25003_003E'])||0),
    vacantUnits:    Math.max(0,parseInt(d['B25002_003E'])||0),
  };
}

async function fetchFRED(seriesId,limit=6) {
  const url=`https://api.stlouisfed.org/fred/series/observations?series_id=${seriesId}&api_key=${KEYS.fred}&file_type=json&sort_order=desc&limit=${limit}`;
  const res=await fetchWithProxy(url);
  const data=await res.json();
  return data.observations.filter(o=>o.value!=='.').map(o=>({date:o.date.slice(0,7),value:parseFloat(o.value)})).reverse();
}

async function fetchRentcast(zip) {
  const url=`https://api.rentcast.io/v1/markets?zipCode=${zip}`;
  // RentCast requires auth header — must use proxy
  const res=await fetchWithProxy(url,{headers:{'X-Api-Key':KEYS.rentcast,accept:'application/json'}});
  const d=await res.json();
  return {
    averageRent:     d.averageRent||d.medianRent||0,
    averageRentYoY:  d.averageRentYoY??d.rentGrowthRate??null,
    daysOnMarket:    d.averageDaysOnMarket||d.medianDaysOnMarket||null,
    averageSalePrice:d.averageSalePrice||d.medianSalePrice||0,
  };
}

async function fetchLiveData(zip) {
  const [cen,rc,mort,hpi]=await Promise.allSettled([
    fetchCensus(zip),
    fetchRentcast(zip),
    fetchFRED('MORTGAGE30US',1),
    fetchFRED('CSUSHPISA',6),
  ]);
  const mk=mockData(zip);
  return {
    census:      cen.status==='fulfilled'  ? cen.value  : mk.census,
    rentcast:    rc.status==='fulfilled'   ? rc.value   : mk.rentcast,
    fredMortgage:mort.status==='fulfilled' ? mort.value[0]?.value??6.82 : 6.82,
    fredHPI:     hpi.status==='fulfilled'&&hpi.value.length>1 ? hpi.value : mk.fredHPI,
    live:{
      census:  cen.status==='fulfilled',
      rentcast:rc.status==='fulfilled',
      fred:    mort.status==='fulfilled',
    },
  };
}

async function runAIDiscovery(strategy, onToken) {
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      model:'claude-sonnet-4-20250514',max_tokens:2000,stream:true,
      tools:[{type:'web_search_20250305',name:'web_search'}],
      system:`You are a real estate investment analyst. Use web search for current 2025 data.
Return ONLY raw JSON no markdown no backticks.
Format: {"reasoning":"2-3 sentence thesis","zips":[{"zip":"XXXXX","city":"City, ST","thesis":"why","signals":["s1","s2","s3"],"riskFlag":"risk or null"}]}
Exactly 10 real US ZIPs. Diverse geography. Strategy: ${strategy}.`,
      messages:[{role:'user',content:`Top 10 US ZIPs for ${strategy} investing 2025. Search appreciation, rent growth, jobs, vacancy. Return only JSON.`}]
    })
  });
  if(!res.ok) throw new Error(`API ${res.status}: ${await res.text()}`);
  const reader=res.body.getReader();
  const dec=new TextDecoder();
  let full='';
  while(true){
    const {done,value}=await reader.read();
    if(done)break;
    for(const line of dec.decode(value).split('\n')){
      if(!line.startsWith('data: '))continue;
      try{
        const e=JSON.parse(line.slice(6));
        if(e.type==='content_block_delta'&&e.delta?.type==='text_delta'){
          full+=e.delta.text; onToken(full);
        }
      }catch{}
    }
  }
  const m=full.match(/\{[\s\S]*\}/);
  if(!m) throw new Error('No JSON found. Got: '+full.slice(0,200));
  return JSON.parse(m[0]);
}

async function doAddZip(zipArg) {
  const input=document.getElementById('zip-input');
  const zip=(zipArg||input.value).trim();
  if(zip.length!==5||!/^\d+$/.test(zip))return;
  if(!zipArg) input.value='';
  if(!S.zips.includes(zip)) S.zips.push(zip);
  S.active=zip;
  S.loading[zip]=true;
  setTabById('analyze');
  renderPage();

  try{
    const data=await fetchLiveData(zip);
    data.scoring=scoreMarket(data,S.strategy);
    S.results[zip]=data;
  }catch{
    const data=mockData(zip);
    data.scoring=scoreMarket(data,S.strategy);
    data.live={census:false,rentcast:false,fred:false};
    S.results[zip]=data;
  }
  S.loading[zip]=false;
  if(S.tab==='analyze') renderPage();
  updateTabLabels();
}

function removeZip(zip){
  S.zips=S.zips.filter(z=>z!==zip);
  delete S.results[zip];
  if(S.active===zip) S.active=S.zips[0]||null;
  renderPage(); updateTabLabels();
}

function selectZip(zip){

function rescoreAll(){
  for(const z of Object.keys(S.results)){
    const r=S.results[z];
    if(r) r.scoring=scoreMarket(r,S.strategy);
  }
}

async function fetchRedfin(id,file,label){
  const btn=document.getElementById(`fbtn-${id}`);
  const msg=document.getElementById(`fmsg-${id}`);
  const bar=document.getElementById(`fbar-${id}`);
  const setMsg=(m,c='#2a4060')=>{if(msg){msg.textContent=m;msg.style.color=c;}};

  if(btn){btn.textContent='FETCHING...';btn.style.background='#0a1525';btn.style.color='#2a4060';btn.style.border='1px solid #1a3050';}
  if(bar)bar.style.display='block';
  setMsg('Connecting...');

  try{
    const s3=RFBASE+file;
    const proxy=`https://api.allorigins.win/raw?url=${encodeURIComponent(s3)}`;
    setMsg('Downloading...');
    const res=await fetch(proxy);
    if(!res.ok)throw new Error('Proxy '+res.status);
    setMsg('Decompressing...');
    const ds=new DecompressionStream('gzip');
    const stream=res.body.pipeThrough(ds);
    const reader=stream.getReader();
    const dec=new TextDecoder();
    let text='',headers=null,rows=[],count=0;
    while(true){
      const {done,value}=await reader.read();
      if(done)break;
      text+=dec.decode(value,{stream:true});
      const lines=text.split('\n');
      text=lines.pop()||'';
      if(!headers&&lines.length>0){headers=lines.shift().split('\t').map(h=>h.trim().replace(/"/g,''));}
      for(const line of lines){
        if(!line.trim())continue;
        const vals=line.split('\t').map(v=>v.trim().replace(/"/g,''));
        const o={};headers.forEach((h,i)=>{o[h]=vals[i]||'';});
        rows.push(o);count++;
        if(count%50===0)setMsg(`Streaming... ${count} rows`);
        if(count>=500){reader.cancel();break;}
      }
      if(rows.length>=500)break;
    }
    if(rows.length===0)throw new Error('No rows parsed');
    S.redfinData=rows; S.redfinFile=label;
    setMsg(`✓ ${rows.length} rows loaded`,'#22d3a0');
    if(btn){btn.textContent='✓ LOADED';btn.style.background='#0a2a18';btn.style.color='#22d3a0';btn.style.border='1px solid #1a5030';}
    updateTabLabels();
    renderPage();
  }catch(e){
    setMsg('Error: '+e.message,'#f87171');
    if(btn){btn.textContent='FETCH LIVE';btn.style.background='linear-gradient(135deg,#0ea5e9,#22d3a0)';btn.style.color='#000';btn.style.border='none';}
  }
  if(bar)bar.style.display='none';
}

function handleUpload(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const lines=ev.target.result.trim().split('\n');
      const headers=lines[0].split('\t').map(h=>h.trim().replace(/"/g,''));
      const rows=lines.slice(1,501).map(l=>{
        const vals=l.split('\t').map(v=>v.trim().replace(/"/g,'')),o={};
        headers.forEach((h,i)=>{o[h]=vals[i]||'';});return o;
      });
      S.redfinData=rows;S.redfinFile=file.name;
      updateTabLabels();renderPage();
    }catch(err){alert('Parse error: '+err.message);}
  };
  reader.readAsText(file);
}

async function testOne(id){
  S.testing[id]=true; S.health[id]=null;
  renderPage();
  try{
    let ok=false,msg='';
    if(id==='anthropic'){ok=true;msg='Connected via Claude.ai';}
    else if(id==='fred'){
      try{
        const r=await fetch(`https://api.stlouisfed.org/fred/series?series_id=MORTGAGE30US&api_key=${KEYS.fred}&file_type=json`);
        ok=r.ok; msg=r.ok?'Connected':'Error '+r.status;
      }catch{
        // Try proxy
        try{
          const r=await fetch(PROXIES[0](`https://api.stlouisfed.org/fred/series?series_id=MORTGAGE30US&api_key=${KEYS.fred}&file_type=json`));
          ok=r.ok; msg=r.ok?'Connected (via proxy)':'Error '+r.status;
        }catch(e){msg='Failed to fetch: '+e.message;}
      }
    }else if(id==='census'){
      const r=await fetch(`https://api.census.gov/data/2022/acs/acs5?get=NAME&for=state:06&key=${KEYS.census}`);
      ok=r.ok; msg=r.ok?'Connected':'Error '+r.status;
    }else if(id==='rentcast'){
      try{
        const r=await fetch(`https://api.rentcast.io/v1/markets?zipCode=10001`,{headers:{'X-Api-Key':KEYS.rentcast}});
        ok=r.ok; msg=r.ok?'Connected':'Error '+r.status;
      }catch{
        try{
          const r=await fetch(PROXIES[0](`https://api.rentcast.io/v1/markets?zipCode=10001`));
          ok=r.ok; msg=r.ok?'Connected (via proxy)':'Error '+r.status;
        }catch(e){msg='Failed: '+e.message;}
      }
    }
    S.health[id]={ok,msg};
  }catch(e){S.health[id]={ok:false,msg:e.message};}
  S.testing[id]=false;
  renderPage();
}

function testAll(){API_SRCS.forEach(s=>testOne(s.id));}
