<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PropIQ — AI Real Estate Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet"/>
<style>
/* ═══════════════════════════════════════════════════
   PROPIQ — Compiled CSS (Tailwind-equivalent, purged)
   Generated: May 2026 | No CDN, no runtime overhead
═══════════════════════════════════════════════════ */

/* Base reset */
*,::before,::after{box-sizing:border-box;border-width:0;border-style:solid}
*{margin:0;padding:0}
html{line-height:1.5;-webkit-text-size-adjust:100%;tab-size:4}
body{line-height:inherit}
hr{height:0;color:inherit;border-top-width:1px}
a{color:inherit;text-decoration:inherit}
b,strong{font-weight:bolder}
code,kbd,samp,pre{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:1em}
small{font-size:80%}
sub,sup{font-size:75%;line-height:0;position:relative;vertical-align:baseline}
sub{bottom:-0.25em}sup{top:-0.5em}
table{text-indent:0;border-color:inherit;border-collapse:collapse}
button,input,optgroup,select,textarea{font-family:inherit;font-size:100%;font-weight:inherit;line-height:inherit;color:inherit;margin:0;padding:0}
button{cursor:pointer;background-color:transparent;background-image:none}
:-moz-focusring{outline:auto}
:-moz-ui-invalid{box-shadow:none}
progress{vertical-align:baseline}
::-webkit-inner-spin-button,::-webkit-outer-spin-button{height:auto}
[type=search]{-webkit-appearance:textfield;outline-offset:-2px}
::-webkit-search-decoration{-webkit-appearance:none}
::-webkit-file-upload-button{-webkit-appearance:button;font:inherit}
summary{display:list-item}
blockquote,dl,dd,h1,h2,h3,h4,h5,h6,hr,figure,p,pre{margin:0}
fieldset{margin:0;padding:0}
legend{padding:0}
ol,ul,menu{list-style:none;margin:0;padding:0}
textarea{resize:vertical}
input::placeholder,textarea::placeholder{opacity:1;color:#9ca3af}
button,[role=button]{cursor:pointer}
img,svg,video,canvas,audio,iframe,embed,object{display:block;vertical-align:middle}
img,video{max-width:100%;height:auto}
[hidden]{display:none}

/* Layout */
.block{display:block}.inline-block{display:inline-block}.flex{display:flex}.grid{display:grid}.hidden{display:none}
.h-full{height:100%}.h-1{height:0.25rem}.h-1\.5{height:0.375rem}.h-2{height:0.5rem}.h-2\.5{height:0.625rem}
.h-3{height:0.75rem}.h-5{height:1.25rem}.h-7{height:1.75rem}.h-8{height:2rem}.h-24{height:6rem}
.h-\[3px\]{height:3px}.h-\[52px\]{height:52px}
.w-full{width:100%}.w-2{width:0.5rem}.w-2\.5{width:0.625rem}.w-3\/5{width:60%}.w-5{width:1.25rem}
.w-6{width:1.5rem}.w-7{width:1.75rem}.w-8{width:2rem}.w-16{width:4rem}.w-24{width:6rem}.w-32{width:8rem}.w-52{width:13rem}
.max-w-md{max-width:28rem}.max-w-xl{max-width:36rem}.max-w-2xl{max-width:42rem}.max-w-3xl{max-width:48rem}
.max-w-\[160px\]{max-width:160px}
.min-w-0{min-width:0}
.flex-1{flex:1 1 0%}.shrink-0{flex-shrink:0}
.flex-col{flex-direction:column}.flex-wrap{flex-wrap:wrap}
.items-start{align-items:flex-start}.items-center{align-items:center}.items-end{align-items:flex-end}
.justify-center{justify-content:center}.justify-between{justify-content:space-between}
.gap-1{gap:0.25rem}.gap-1\.5{gap:0.375rem}.gap-2{gap:0.5rem}.gap-3{gap:0.75rem}.gap-4{gap:1rem}.gap-5{gap:1.25rem}.gap-6{gap:1.5rem}
.grid-cols-1{grid-template-columns:repeat(1,minmax(0,1fr))}
.grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.overflow-hidden{overflow:hidden}.overflow-x-auto{overflow-x:auto}
.relative{position:relative}.absolute{position:absolute}.sticky{position:sticky}
.inset-0{inset:0}.top-0{top:0}.left-0{left:0}.right-0{right:0}
.z-50{z-index:50}
.mx-auto{margin-left:auto;margin-right:auto}
.ml-0\.5{margin-left:0.125rem}.ml-1{margin-left:0.25rem}
.mt-0\.5{margin-top:0.125rem}.mt-1{margin-top:0.25rem}.mt-2{margin-top:0.5rem}.mt-3{margin-top:0.75rem}.mt-4{margin-top:1rem}
.mb-1{margin-bottom:0.25rem}.mb-1\.5{margin-bottom:0.375rem}.mb-2{margin-bottom:0.5rem}.mb-3{margin-bottom:0.75rem}
.mb-4{margin-bottom:1rem}.mb-5{margin-bottom:1.25rem}.mb-8{margin-bottom:2rem}
.p-0{padding:0}.p-4{padding:1rem}.p-5{padding:1.25rem}.p-6{padding:1.5rem}.p-10{padding:2.5rem}.p-20{padding:5rem}
.px-1\.5{padding-left:0.375rem;padding-right:0.375rem}.px-2{padding-left:0.5rem;padding-right:0.5rem}
.px-3{padding-left:0.75rem;padding-right:0.75rem}.px-4{padding-left:1rem;padding-right:1rem}
.px-5{padding-left:1.25rem;padding-right:1.25rem}.px-14{padding-left:3.5rem;padding-right:3.5rem}
.py-0\.5{padding-top:0.125rem;padding-bottom:0.125rem}.py-1{padding-top:0.25rem;padding-bottom:0.25rem}
.py-1\.5{padding-top:0.375rem;padding-bottom:0.375rem}.py-2{padding-top:0.5rem;padding-bottom:0.5rem}
.py-2\.5{padding-top:0.625rem;padding-bottom:0.625rem}.py-3{padding-top:0.75rem;padding-bottom:0.75rem}
.py-4{padding-top:1rem;padding-bottom:1rem}.py-5{padding-top:1.25rem;padding-bottom:1.25rem}
.pt-3{padding-top:0.75rem}.pt-4{padding-top:1rem}.pb-3{padding-bottom:0.75rem}

/* Typography */
.font-mono{font-family:"DM Mono",ui-monospace,monospace}
.font-sans{font-family:"DM Sans",ui-sans-serif,system-ui,sans-serif}
.font-display{font-family:"Bebas Neue",sans-serif}
.text-xs{font-size:0.75rem;line-height:1rem}.text-sm{font-size:0.875rem;line-height:1.25rem}
.text-base{font-size:1rem;line-height:1.5rem}.text-lg{font-size:1.125rem;line-height:1.75rem}
.text-xl{font-size:1.25rem;line-height:1.75rem}.text-2xl{font-size:1.5rem;line-height:2rem}
.text-3xl{font-size:1.875rem;line-height:2.25rem}.text-4xl{font-size:2.25rem;line-height:2.5rem}
.text-5xl{font-size:3rem;line-height:1}
.text-\[8px\]{font-size:8px}.text-\[9px\]{font-size:9px}.text-\[10px\]{font-size:10px}.text-\[11px\]{font-size:11px}
.font-medium{font-weight:500}.font-semibold{font-weight:600}.font-bold{font-weight:700}
.italic{font-style:italic}
.leading-none{line-height:1}.leading-relaxed{line-height:1.625}
.tracking-wider{letter-spacing:0.05em}.tracking-widest{letter-spacing:0.1em}.tracking-\[0\.22em\]{letter-spacing:0.22em}
.text-left{text-align:left}.text-center{text-align:center}.text-right{text-align:right}
.whitespace-nowrap{white-space:nowrap}.break-all{word-break:break-all}
.no-underline{text-decoration-line:none}
.align-middle{vertical-align:middle}

/* Colors - text */
.text-white{color:#fff}.text-black{color:#000}
.text-\[\#1a3050\]{color:#1a3050}.text-\[\#1a4060\]{color:#1a4060}.text-\[\#1e3050\]{color:#1e3050}
.text-\[\#22d3a0\]{color:#22d3a0}.text-\[\#2a4060\]{color:#2a4060}.text-\[\#2a5070\]{color:#2a5070}
.text-\[\#2a5080\]{color:#2a5080}.text-\[\#2a6040\]{color:#2a6040}.text-\[\#38bdf8\]{color:#38bdf8}
.text-\[\#3a5070\]{color:#3a5070}.text-\[\#3a5570\]{color:#3a5570}.text-\[\#3a6080\]{color:#3a6080}
.text-\[\#4a6080\]{color:#4a6080}.text-\[\#5a8090\]{color:#5a8090}.text-\[\#7ab8e0\]{color:#7ab8e0}
.text-\[\#94a3b8\]{color:#94a3b8}.text-\[\#d97706\]{color:#d97706}.text-\[\#f87171\]{color:#f87171}
.text-\[\#fbbf24\]{color:#fbbf24}

/* Colors - background */
.bg-transparent{background-color:transparent}
.bg-\[\#030c18\]{background-color:#030c18}.bg-\[\#060f1e\]{background-color:#060f1e}
.bg-\[\#071a10\]{background-color:#071a10}.bg-\[\#090f1e\]{background-color:#090f1e}
.bg-\[\#0a1525\]{background-color:#0a1525}.bg-\[\#0d1a28\]{background-color:#0d1a28}
.bg-\[\#0d2035\]{background-color:#0d2035}.bg-\[\#180808\]{background-color:#180808}
.bg-\[\#38bdf8\]{background-color:#38bdf8}

/* Colors - border */
.border{border-width:1px}.border-b{border-bottom-width:1px}.border-t{border-top-width:1px}
.border-l-4{border-left-width:4px}.border-none{border-style:none}
.border-collapse{border-collapse:collapse}.border-dashed{border-style:dashed}
.border-\[\#0d1a28\]{border-color:#0d1a28}.border-\[\#0d1e30\]{border-color:#0d1e30}
.border-\[\#121e30\]{border-color:#121e30}.border-\[\#132030\]{border-color:#132030}
.border-\[\#1a2a40\]{border-color:#1a2a40}.border-\[\#1a3050\]{border-color:#1a3050}
.border-\[\#1a3a5a\]{border-color:#1a3a5a}.border-\[\#1a4a30\]{border-color:#1a4a30}
.border-\[\#38bdf8\]{border-color:#38bdf8}.border-\[\#4a1515\]{border-color:#4a1515}

/* Border radius */
.rounded{border-radius:0.25rem}.rounded-md{border-radius:0.375rem}.rounded-lg{border-radius:0.5rem}
.rounded-xl{border-radius:0.75rem}.rounded-2xl{border-radius:1rem}.rounded-full{border-radius:9999px}

/* Opacity */
.opacity-10{opacity:0.1}.opacity-\[0\.025\]{opacity:0.025}

/* Cursor */
.cursor-pointer{cursor:pointer}

/* Outline */
.outline-none{outline:2px solid transparent;outline-offset:2px}

/* Transition */
.transition-colors{transition-property:color,background-color,border-color;transition-timing-function:cubic-bezier(0.4,0,0.2,1);transition-duration:150ms}

/* Hover */
.hover\:border-\[\#38bdf8\]:hover{border-color:#38bdf8}

/* Responsive breakpoints */
@media(min-width:640px){
  .sm\:grid-cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .sm\:grid-cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media(min-width:768px){
  .md\:grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .md\:grid-cols-5{grid-template-columns:repeat(5,minmax(0,1fr))}
}

/* ── Custom overrides ── */
  * { box-sizing: border-box; }
  body { background: #020812; color: #e2e8f0; font-family: 'DM Sans', sans-serif; margin: 0; }
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: #060f1e; }
  ::-webkit-scrollbar-thumb { background: #1a3050; border-radius: 2px; }
  .tab-btn { border-bottom: 2px solid transparent; transition: all .15s; }
  .tab-btn.active { border-bottom-color: #38bdf8; color: #38bdf8; }
  .strategy-btn { transition: all .15s; }
  .strategy-btn.active { background: #0a2a18; border-color: #22d3a0; color: #22d3a0; }
  .score-ring { transition: stroke-dasharray 1.2s ease; }
  .score-bar-fill { transition: width 1.1s ease; }
  @keyframes progress-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
  .progress-slide { animation: progress-slide 1.4s linear infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  .blink { animation: blink 0.8s step-end infinite; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
  .fade-in { animation: fadeIn 0.3s ease forwards; }
  input[type=password]::-webkit-input-placeholder { color: #2a4060; }
  .rank-1  { background: #f59e0b; }
  .rank-2  { background: #22d3a0; }
  .rank-3  { background: #22d3a0; }
  .rank-lo { background: #38bdf8; }
  .rank-no { background: #132030; }
  .source-green  { border-left: 3px solid #22d3a0; }
  .source-blue   { border-left: 3px solid #38bdf8; }
  .source-yellow { border-left: 3px solid #fbbf24; }
  .source-purple { border-left: 3px solid #a78bfa; }
  .source-red    { border-left: 3px solid #f87171; }
  .zip-row:hover { background: #0d1e30 !important; }
  .ds-card:hover { border-color: #1e3a5f !important; }
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════════════════════
     NAVIGATION
═══════════════════════════════════════════════════════════════════════════ -->
<div class="sticky top-0 z-50 bg-[#030c18] border-b border-[#0d1e30]">
  <!-- Row 1: Logo + ZIP -->
  <div class="flex items-center justify-between px-4 h-[52px]">
    <div class="flex items-center gap-2">
      <div class="w-7 h-7 rounded-lg flex items-center justify-center text-sm" style="background:linear-gradient(135deg,#22d3a0,#0ea5e9)">&#11041;</div>
      <span class="font-display text-xl tracking-widest text-white">PROPIQ</span>
      <span class="font-mono text-[9px] text-[#1a3050] tracking-widest ml-1">AI</span>
    </div>
    <div class="flex gap-2">
      <input id="zip-input" type="text" maxlength="5" placeholder="ZIP"
        class="w-16 bg-[#090f1e] border border-[#1a2a40] text-white text-sm px-2 py-1.5 rounded-md font-mono outline-none"
        oninput="this.value=this.value.replace(/\D/g,'')"
        onkeydown="if(event.key==='Enter')addZip()"/>
      <button onclick="addZip()"
        class="w-8 h-8 rounded-md font-bold text-black text-lg flex items-center justify-center"
        style="background:linear-gradient(135deg,#0ea5e9,#22d3a0)">+</button>
    </div>
  </div>
  <!-- Row 2: Strategy pills -->
  <div id="strategy-bar" class="flex items-center gap-2 px-4 py-2 overflow-x-auto border-b border-[#0d1e30]">
    <span class="font-mono text-[9px] text-[#1a3050] tracking-widest shrink-0">STRATEGY</span>
  </div>
  <!-- Row 3: Tab bar -->
  <div class="flex overflow-x-auto" id="tab-bar"></div>
</div>

<!-- ═══════════════════════════════════════════════════════════════════════════
     PAGE CONTENT
═══════════════════════════════════════════════════════════════════════════ -->
<div class="px-4 py-5" id="page-content"></div>

<!-- ═══════════════════════════════════════════════════════════════════════════
     TEMPLATES
═══════════════════════════════════════════════════════════════════════════ -->

<!-- Discover Tab -->
<template id="tpl-discover">
  <div class="max-w-3xl mx-auto flex flex-col gap-5">
    <!-- Hero -->
    <div class="rounded-2xl border border-[#132030] text-center relative overflow-hidden p-10" style="background:linear-gradient(135deg,#050e1c,#020812,#031210)">
      <div class="absolute inset-0 opacity-[0.025]" style="background-image:linear-gradient(#38bdf8 1px,transparent 1px),linear-gradient(90deg,#38bdf8 1px,transparent 1px);background-size:40px 40px"></div>
      <div class="relative">
        <p class="font-mono text-[11px] text-[#1a4060] tracking-[0.22em] mb-3">CLAUDE SONNET &middot; WEB SEARCH &middot; LIVE 2025 DATA</p>
        <h2 class="font-display text-5xl tracking-wider text-white mb-3">AI MARKET DISCOVERY</h2>
        <p class="text-sm text-[#3a5570] max-w-md mx-auto mb-8 leading-relaxed">
          Searches live data &mdash; appreciation, rent growth, job corridors, vacancy &mdash; to surface the
          <strong class="text-[#38bdf8]">top 10 ZIP codes</strong> for your selected strategy.
        </p>
        <button id="discover-btn" onclick="runDiscover()"
          class="font-display text-base tracking-widest px-14 py-4 rounded-xl font-bold text-black cursor-pointer border-none"
          style="background:linear-gradient(135deg,#0ea5e9,#22d3a0)">
          &#9889; FIND TOP 10 ZIP CODES
        </button>
      </div>
    </div>
    <!-- Stream -->
    <div id="discover-stream" class="hidden rounded-xl border border-[#132030] p-5 bg-[#060f1e]">
      <div class="font-mono text-[9px] text-[#1a3050] tracking-widest mb-2">LIVE AI REASONING</div>
      <div id="stream-text" class="font-mono text-xs text-[#2a5070] leading-relaxed break-all"></div>
    </div>
    <!-- Error -->
    <div id="discover-error" class="hidden rounded-xl border border-[#4a1515] p-4 bg-[#180808] font-mono text-xs text-[#f87171]"></div>
    <!-- Results -->
    <div id="discover-results" class="hidden flex-col gap-4">
      <div id="discover-thesis" class="rounded-xl border-l-4 border-[#38bdf8] border border-[#132030] p-5 bg-[#060f1e] flex gap-4 items-start">
        <span class="text-2xl shrink-0">&#129504;</span>
        <div>
          <div class="font-mono text-[9px] text-[#1a4060] tracking-widest mb-2">AI MARKET THESIS</div>
          <p id="thesis-text" class="text-sm text-[#7ab8e0] italic leading-relaxed"></p>
        </div>
      </div>
      <div id="zip-grid" class="grid grid-cols-2 gap-3"></div>
      <button onclick="loadAllZips()"
        class="w-full bg-[#0a1525] border border-[#1a3a5a] text-[#38bdf8] font-display text-sm tracking-widest py-4 rounded-xl cursor-pointer">
        &#8681; LOAD ALL 10 INTO ANALYZER
      </button>
    </div>
  </div>
</template>

<!-- Analyze Tab -->
<template id="tpl-analyze">
  <div id="analyze-empty" class="max-w-2xl mx-auto rounded-2xl border border-dashed border-[#132030] bg-[#060f1e] p-20 text-center">
    <div class="text-4xl opacity-10 mb-4">&#128202;</div>
    <p class="font-mono text-sm text-[#1a3050]">No markets loaded &mdash; use AI Discover or enter a ZIP in the nav bar</p>
  </div>
  <div id="analyze-content" class="hidden flex gap-5 items-start">
    <!-- Rankings sidebar -->
    <div class="w-52 shrink-0">
      <div class="font-mono text-[9px] text-[#2a4060] tracking-widest mb-3" id="rankings-label">RANKINGS</div>
      <div id="rankings-list" class="flex flex-col gap-1.5"></div>
    </div>
    <!-- Detail panel -->
    <div id="detail-panel" class="flex-1 min-w-0 flex flex-col gap-4"></div>
  </div>
</template>

<!-- Data Tab -->
<template id="tpl-data">
  <div class="max-w-3xl mx-auto flex flex-col gap-5">
    <!-- Status banner -->
    <div id="data-loaded-banner" class="hidden rounded-xl border border-[#1a4a30] bg-[#071a10] p-4 flex items-center gap-4">
      <span class="text-xl">&#9989;</span>
      <div>
        <div id="data-loaded-name" class="font-mono text-sm text-[#22d3a0] font-bold"></div>
        <div id="data-loaded-info" class="font-mono text-xs text-[#2a6040] mt-1"></div>
      </div>
    </div>
    <!-- Fetch cards -->
    <div class="rounded-2xl border border-[#132030] bg-[#060f1e] p-6">
      <div class="font-mono text-[9px] text-[#2a4060] tracking-widest mb-1">REDFIN DATA CENTER &mdash; FETCH DIRECTLY</div>
      <p class="text-xs text-[#2a4060] mb-5 leading-relaxed">Streams live from Redfin's S3 bucket, decompresses in-browser. No download needed.</p>
      <div id="dataset-cards" class="flex flex-col gap-3"></div>
    </div>
    <!-- Manual upload -->
    <div class="rounded-2xl border border-[#132030] bg-[#060f1e] p-6">
      <div class="font-mono text-[9px] text-[#2a4060] tracking-widest mb-2">MANUAL UPLOAD FALLBACK</div>
      <p class="text-xs text-[#2a4060] mb-4">If live fetch fails, download the .gz, decompress, upload .tsv here.</p>
      <label class="flex items-center gap-3 border border-dashed border-[#1a3050] rounded-xl p-4 cursor-pointer hover:border-[#38bdf8] transition-colors">
        <span class="text-xl">&#128194;</span>
        <span class="font-mono text-sm text-[#3a6080]">Upload .tsv / .csv file</span>
        <input type="file" accept=".tsv,.csv,.txt" class="hidden" onchange="handleFileUpload(event)"/>
      </label>
    </div>
    <!-- Preview table -->
    <div id="data-preview" class="hidden rounded-2xl border border-[#132030] bg-[#060f1e] p-6">
      <div class="font-mono text-[9px] text-[#2a4060] tracking-widest mb-4" id="preview-label"></div>
      <div class="overflow-x-auto">
        <table id="preview-table" class="w-full border-collapse font-mono text-xs"></table>
      </div>
    </div>
  </div>
</template>

<!-- API & Health Tab -->
<template id="tpl-api">
  <div class="max-w-xl mx-auto flex flex-col gap-4">
    <!-- Header + test all -->
    <div class="rounded-2xl border border-[#132030] bg-[#060f1e] p-5">
      <div class="font-mono text-[9px] text-[#2a4060] tracking-widest mb-1">API HEALTH STATUS</div>
      <p class="text-xs text-[#3a6080] mb-4">All 3 keys are pre-loaded. Click to verify live connections.</p>
      <button onclick="testAllAPIs()"
        class="w-full font-display text-sm tracking-widest py-3 rounded-xl font-bold text-black border-none cursor-pointer"
        style="background:linear-gradient(135deg,#0ea5e9,#22d3a0)">
        &#9889; TEST ALL CONNECTIONS
      </button>
    </div>
    <!-- Health rows -->
    <div class="rounded-2xl border border-[#132030] bg-[#060f1e] overflow-hidden" id="health-rows"></div>
    <!-- Key config -->
    <div class="rounded-2xl border border-[#132030] bg-[#060f1e] p-5">
      <div class="font-mono text-[9px] text-[#2a4060] tracking-widest mb-4">API KEY CONFIGURATION</div>
      <div class="flex flex-col gap-3" id="key-config-rows"></div>

</template>

<script>
// ═══════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════
const STRATEGY_WEIGHTS = {
  'Buy & Hold': { appreciation:.25, cashflow:.35, liquidity:.15, demand:.15, supply:.10 },
  'BRRRR':      { appreciation:.30, cashflow:.30, liquidity:.15, demand:.15, supply:.10 },
  'Fix & Flip': { appreciation:.40, cashflow:.10, liquidity:.30, demand:.10, supply:.10 },
  'Wholesale':  { appreciation:.20, cashflow:.10, liquidity:.40, demand:.20, supply:.10 },
};

const REDFIN_DATASETS = [
  { id:'zip',    label:'ZIP Code Market Tracker',  file:'zip_code_market_tracker.tsv000.gz',     cols:['region','median_sale_price','median_dom','inventory','homes_sold'] },
  { id:'metro',  label:'Metro Market Tracker',     file:'redfin_metro_market_tracker.tsv000.gz', cols:['region','median_sale_price','median_dom','inventory'] },
  { id:'city',   label:'City Market Tracker',      file:'city_market_tracker.tsv000.gz',         cols:['region','median_sale_price','median_dom','inventory'] },
  { id:'county', label:'County Market Tracker',    file:'county_market_tracker.tsv000.gz',       cols:['region','median_sale_price','median_dom','inventory'] },
];
const REDFIN_BASE = 'https://redfin-public-data.s3.us-west-2.amazonaws.com/redfin_market_tracker/';

const KEYS = {
  fred:     '980ec69f10cd51ef9eadbeb12b6e6467',
  rentcast: '2ec38dc7a17c4cff9a6aa31eb8d1e5b2',
  census:   'f47bebd1c416c39d731f7e329b9365b3de5a74e9',
};

const API_SOURCES = [
  { id:'anthropic', name:'Anthropic Claude', desc:'AI discovery + web search',               color:'#a78bfa', free:true,  url:'https://api.anthropic.com' },
  { id:'fred',      name:'FRED API',         desc:'HPI, mortgage rates, building permits',   color:'#38bdf8', free:true,  url:'https://fred.stlouisfed.org/docs/api/api_key.html' },
  { id:'census',    name:'US Census ACS',    desc:'Income, rent, vacancy, population by ZIP',color:'#22d3a0', free:true,  url:'https://api.census.gov/data/key_signup.html' },
  { id:'rentcast',  name:'RentCast',         desc:'Rent estimates, DOM, sale prices by ZIP', color:'#fbbf24', free:false, limit:'50 calls/mo', url:'https://app.rentcast.io/app/api-keys' },
];

const SOURCE_GUIDE = [
  { name:'Anthropic Claude', color:'#a78bfa', feeds:'AI ZIP discovery, market thesis, web search synthesis',          limit:'Built-in',      status:'Always active' },
  { name:'US Census ACS',    color:'#22d3a0', feeds:'Income, home value, rent, vacancy, population by ZIP',           limit:'Free, no limits', status:'Key loaded' },
  { name:'FRED API',         color:'#38bdf8', feeds:'30yr mortgage rate, Case-Shiller HPI, building permits',         limit:'Free',          status:'Key loaded' },
  { name:'RentCast',         color:'#fbbf24', feeds:'Rent estimates, days-on-market, avg sale price by ZIP',          limit:'50 calls/mo',   status:'Key loaded' },
  { name:'Redfin Data',      color:'#f87171', feeds:'Inventory, median DOM, homes sold, price cuts by ZIP/metro',     limit:'Free, streaming', status:'Fetch in Data tab' },
];

// ═══════════════════════════════════════════════════════════
// APP STATE
// ═══════════════════════════════════════════════════════════
const state = {
  tab:        'discover',
  strategy:   'Buy & Hold',
  zips:       [],
  results:    {},
  loading:    {},
  activeZip:  null,
  redfinData: null,
  redfinFile: null,
  discoverResult: null,
  apiHealth:  {},
  apiTesting: {},
};

// ═══════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════
const fmt = (n, pre='', suf='') => n ? `${pre}${Number(n).toLocaleString()}${suf}` : '--';
const sc  = s => s >= 7.5 ? '#22d3a0' : s >= 5 ? '#fbbf24' : '#f87171';
const scLabel = s => s >= 7.5 ? 'STRONG BUY' : s >= 5 ? 'MODERATE' : 'AVOID';
const h   = (tag, cls, html='', attrs='') => `<${tag} class="${cls}" ${attrs}>${html}</${tag}>`;
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function getMockData(zip) {
  const seed = zip.split('').reduce((a,c) => a + c.charCodeAt(0), 0);
  const rng = (min, max, s=7919) => min + ((seed*s + 6271) % 9973) / 9973 * (max-min);
  return {
    census: {
      name: `ZIP ${zip}`,
      medianIncome:    Math.round(rng(42000,118000)),
      medianRent:      Math.round(rng(850,3100)),
      medianHomeValue: Math.round(rng(140000,720000)),
      totalOccupied:   Math.round(rng(6000,52000)),
      ownerOccupied:   Math.round(rng(3000,32000)),
      renterOccupied:  Math.round(rng(2500,22000)),
      vacantUnits:     Math.round(rng(150,5000)),
      totalPopulation: Math.round(rng(14000,110000)),
    },
    rentcast: {
      averageRent:      Math.round(rng(850,3100)),
      averageRentYoY:   parseFloat(rng(0.5,11,3571).toFixed(1)),
      daysOnMarket:     Math.round(rng(8,85,3571)),
      averageSalePrice: Math.round(rng(145000,725000)),
    },
    fredMortgage: 6.82,
    fredHPI: [
      {date:'Jan 24', value: Math.round(rng(280,340)*10)/10},
      {date:'Apr 24', value: Math.round(rng(285,352)*10)/10},
      {date:'Jul 24', value: Math.round(rng(290,362)*10)/10},
      {date:'Oct 24', value: Math.round(rng(293,370)*10)/10},
      {date:'Jan 25', value: Math.round(rng(296,378)*10)/10},
    ],
  };
}

function scoreMarket(data, strategy) {
  const { census, rentcast, fredMortgage } = data;
  const weights = STRATEGY_WEIGHTS[strategy];
  let appreciation = 5;
  if (census.medianHomeValue > 0)
    appreciation = Math.min(10, Math.max(0, ((census.medianRent*12)/census.medianHomeValue)*100));
  if (rentcast?.averageRentYoY) appreciation = Math.min(10, appreciation + rentcast.averageRentYoY/2);

  let cashflow = 5;
  if (census.medianHomeValue > 0 && fredMortgage > 0 && census.medianRent > 0) {
    const loan = census.medianHomeValue*0.8, mr = fredMortgage/100/12;
    const piti = loan*(mr*Math.pow(1+mr,360))/(Math.pow(1+mr,360)-1)*1.25;
    cashflow = Math.min(10, Math.max(0, (census.medianRent*0.95 - piti + 500)/110));
  }

  let liquidity = 5;
  if (rentcast?.daysOnMarket) liquidity = Math.min(10, Math.max(1, 10-(rentcast.daysOnMarket-20)*0.1));

  let demand = 5;
  if (census.medianIncome > 0) {
    demand = Math.min(10, Math.max(1, 12-((census.medianRent*12)/census.medianIncome)*20));
    demand = Math.min(10, demand + (census.renterOccupied/(census.totalOccupied||1))*2);
  }

  let supply = 5;
  if (census.vacantUnits > 0 && census.totalOccupied > 0)
    supply = Math.min(10, Math.max(1, 11-(census.vacantUnits/(census.totalOccupied+census.vacantUnits))*60));

  const scores = { appreciation, cashflow, liquidity, demand, supply };
  const composite = Object.entries(weights).reduce((s,[k,w]) => s+scores[k]*w, 0);
  return { scores, composite, weights };
}

// ═══════════════════════════════════════════════════════════
// API FETCHERS
// ═══════════════════════════════════════════════════════════
async function fetchCensus(zip) {
  const vars = ['B19013_001E','B25064_001E','B25077_001E','B01003_001E','B25003_001E','B25003_002E','B25003_003E','B25002_003E','NAME'].join(',');
  const res = await fetch(`https://api.census.gov/data/2022/acs/acs5?get=${vars}&for=zip%20code%20tabulation%20area:${zip}&key=${KEYS.census}`);
  if (!res.ok) throw new Error(`Census ${res.status}`);
  const [headers, values] = await res.json();
  const d = {};
  headers.forEach((h,i) => { d[h]=values[i]; });
  return {
    name:            d['NAME'] || `ZIP ${zip}`,
    medianIncome:    Math.max(0, parseInt(d['B19013_001E'])||0),
    medianRent:      Math.max(0, parseInt(d['B25064_001E'])||0),
    medianHomeValue: Math.max(0, parseInt(d['B25077_001E'])||0),
    totalPopulation: Math.max(0, parseInt(d['B01003_001E'])||0),
    totalOccupied:   Math.max(0, parseInt(d['B25003_001E'])||0),
    ownerOccupied:   Math.max(0, parseInt(d['B25003_002E'])||0),
    renterOccupied:  Math.max(0, parseInt(d['B25003_003E'])||0),
    vacantUnits:     Math.max(0, parseInt(d['B25002_003E'])||0),
  };
}

async function fetchRentcast(zip) {
  const res = await fetch(`https://api.rentcast.io/v1/markets?zipCode=${zip}`, {headers:{'X-Api-Key':KEYS.rentcast, accept:'application/json'}});
  if (!res.ok) throw new Error(`RentCast ${res.status}`);
  const d = await res.json();
  return {
    averageRent:      d.averageRent || d.medianRent || 0,
    averageRentYoY:   d.averageRentYoY ?? d.rentGrowthRate ?? null,
    daysOnMarket:     d.averageDaysOnMarket || d.medianDaysOnMarket || null,
    averageSalePrice: d.averageSalePrice || d.medianSalePrice || 0,
  };
}

async function fetchFREDSeries(seriesId, limit=12) {
  const res = await fetch(`https://api.stlouisfed.org/fred/series/observations?series_id=${seriesId}&api_key=${KEYS.fred}&file_type=json&sort_order=desc&limit=${limit}`);
  if (!res.ok) throw new Error(`FRED ${res.status}`);
  const data = await res.json();
  return data.observations.filter(o=>o.value!=='.').map(o=>({date:o.date.slice(0,7),value:parseFloat(o.value)})).reverse();
}

async function fetchLiveData(zip) {
  const [census, rentcast, mortObs, hpiObs] = await Promise.allSettled([
    fetchCensus(zip), fetchRentcast(zip),
    fetchFREDSeries('MORTGAGE30US',1), fetchFREDSeries('CSUSHPISA',6),
  ]);
  const mock = getMockData(zip);
  return {
    census:      census.status==='fulfilled'     ? census.value       : mock.census,
    rentcast:    rentcast.status==='fulfilled'   ? rentcast.value     : mock.rentcast,
    fredMortgage: mortObs.status==='fulfilled'   ? mortObs.value[0]?.value ?? 6.82 : 6.82,
    fredHPI:     hpiObs.status==='fulfilled' && hpiObs.value.length>1 ? hpiObs.value : mock.fredHPI,
    liveSources: {
      census:   census.status==='fulfilled',
      rentcast: rentcast.status==='fulfilled',
      fred:     mortObs.status==='fulfilled',
    },
  };
}

async function runAIDiscovery(strategy, onToken) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      model:'claude-sonnet-4-20250514', max_tokens:2000, stream:true,
      tools:[{type:'web_search_20250305',name:'web_search'}],
      system:`You are a real estate investment analyst. Use web search for current 2025 data.
Return ONLY raw JSON no markdown no backticks no explanation outside JSON.
Format: {"reasoning":"2-3 sentence thesis","zips":[{"zip":"XXXXX","city":"City, ST","thesis":"why","signals":["s1","s2","s3"],"riskFlag":"risk or null"}]}
Exactly 10 ZIPs. Real US ZIPs. Diverse geography. Strategy: ${strategy}.`,
      messages:[{role:'user',content:`Find top 10 US ZIP codes for ${strategy} investing in 2025. Search appreciation, rent growth, jobs, vacancy. Return only JSON.`}]
    })
  });
  if (!res.ok) throw new Error(`API ${res.status}: ${await res.text()}`);
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let full = '';
  while (true) {
    const {done, value} = await reader.read();
    if (done) break;
    for (const line of dec.decode(value).split('\n')) {
      if (!line.startsWith('data: ')) continue;
      try {
        const evt = JSON.parse(line.slice(6));
        if (evt.type==='content_block_delta' && evt.delta?.type==='text_delta') {
          full += evt.delta.text; onToken(full);
        }
      } catch {}
    }
  }
  const match = full.match(/\{[\s\S]*\}/);
  if (!match) throw new Error('No JSON found. Got: ' + full.slice(0,200));
  return JSON.parse(match[0]);
}

// ═══════════════════════════════════════════════════════════
// ZIP MANAGEMENT
// ═══════════════════════════════════════════════════════════
async function addZip(zipArg) {
  const zip = (zipArg || document.getElementById('zip-input').value).trim();
  if (zip.length !== 5 || !/^\d+$/.test(zip)) return;
  if (!zipArg) document.getElementById('zip-input').value = '';
  if (!state.zips.includes(zip)) state.zips.push(zip);
  state.activeZip = zip;
  state.loading[zip] = true;
  setTab('analyze');
  renderAnalyze();
  try {
    const data = await fetchLiveData(zip);
    data.scoring = scoreMarket(data, state.strategy);
    state.results[zip] = data;
  } catch {
    const data = getMockData(zip);
    data.scoring = scoreMarket(data, state.strategy);
    data.liveSources = {census:false,rentcast:false,fred:false};
    state.results[zip] = data;
  }
  state.loading[zip] = false;
  if (state.tab === 'analyze') renderAnalyze();
  updateTabBar();
}

function loadAllZips() {
  if (!state.discoverResult) return;
  state.discoverResult.zips.forEach(z => addZip(z.zip));
}

function removeZip(zip) {
  state.zips = state.zips.filter(z => z !== zip);
  delete state.results[zip];
  if (state.activeZip === zip) state.activeZip = state.zips[0] || null;
  renderAnalyze();
  updateTabBar();
}

function setActiveZip(zip) {
  state.activeZip = zip;
  renderAnalyze();
}

function rescoreAll() {
  for (const zip of Object.keys(state.results)) {
    const r = state.results[zip];
    if (r) r.scoring = scoreMarket(r, state.strategy);
  }
}

// ═══════════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════════
function setTab(tab) {
  state.tab = tab;
  updateTabBar();
  renderPage();
}

function setStrategy(s) {
  state.strategy = s;
  rescoreAll();
  document.querySelectorAll('.strategy-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.strategy === s);
  });

}

function updateTabBar() {
  const tabs = [
    {id:'discover', icon:'&#9889;', label:'DISCOVER'},
    {id:'analyze',  icon:'&#128202;', label: state.zips.length ? `ANALYZE (${state.zips.length})` : 'ANALYZE'},

    <button onclick="setTab('${t.id}')"
      class="tab-btn shrink-0 bg-transparent border-none font-mono text-xs font-bold tracking-wider px-5 py-3 cursor-pointer ${state.tab===t.id ? 'active text-[#38bdf8]' : 'text-[#2a4060]'}">
      ${t.icon} ${t.label}
    </button>
  `).join('');
}

function renderPage() {
  const content = document.getElementById('page-content');
  const tpl = document.getElementById(`tpl-${state.tab}`);
  content.innerHTML = '';
  const clone = tpl.content.cloneNode(true);
  content.appendChild(clone);
  if      (state.tab === 'discover') renderDiscover();
  else if (state.tab === 'analyze')  renderAnalyze();
  else if (state.tab === 'data')     renderData();
  else if (state.tab === 'api')      renderAPI();
}

// ═══════════════════════════════════════════════════════════
// DISCOVER TAB
// ═══════════════════════════════════════════════════════════
function renderDiscover() {
  if (state.discoverResult) showDiscoverResults(state.discoverResult);
}

async function runDiscover() {
  const btn = document.getElementById('discover-btn');
  const streamDiv = document.getElementById('discover-stream');
  const streamText = document.getElementById('stream-text');
  const errorDiv = document.getElementById('discover-error');
  const resultsDiv = document.getElementById('discover-results');

  btn.textContent = '&#9211; SCANNING MARKETS...';
  btn.style.background = '#0a1525';
  btn.style.border = '1px solid #1a3050';
  btn.style.color = '#2a4060';
  errorDiv.classList.add('hidden');
  resultsDiv.classList.add('hidden');

  try {
    const data = await runAIDiscovery(state.strategy, full => {
      const clean = full.replace(/[^\x20-\x7E\n]/g,'').slice(-600);
      streamDiv.classList.remove('hidden');
      streamText.innerHTML = esc(clean) + '<span class="blink inline-block w-2 h-3 bg-[#38bdf8] ml-0.5 align-middle"></span>';
    });
    state.discoverResult = data;
    showDiscoverResults(data);
  } catch(e) {
    errorDiv.textContent = '&#9888; ' + e.message;
    errorDiv.classList.remove('hidden');
  }

  btn.innerHTML = '&#8635; RUN NEW SCAN';
  btn.style.background = 'linear-gradient(135deg,#0ea5e9,#22d3a0)';
  btn.style.border = 'none';
  btn.style.color = '#000';
}

function showDiscoverResults(data) {
  const streamDiv = document.getElementById('discover-stream');
  const resultsDiv = document.getElementById('discover-results');
  const thesisText = document.getElementById('thesis-text');
  const zipGrid = document.getElementById('zip-grid');
  if (!streamDiv || !resultsDiv) return;

  streamDiv.classList.add('hidden');
  thesisText.textContent = data.reasoning || '';
  resultsDiv.classList.remove('hidden');
  resultsDiv.style.display = 'flex';

  const medals = ['&#129351;','&#129352;','&#129353;'];
  const rankBg = i => i===0?'#1a0e00':i<3?'#001410':i<7?'#00091a':'#090f1e';
  const rankBd = i => i===0?'#4a2800':i<3?'#184030':i<7?'#0a2a48':'#121e30';
  const rankBar = i => i===0?'#f59e0b':i<3?'#22d3a0':i<7?'#38bdf8':'#1e3050';

  zipGrid.innerHTML = (data.zips||[]).map((z,i) => `
    <div class="rounded-2xl p-5 relative overflow-hidden fade-in" style="background:${rankBg(i)};border:1px solid ${rankBd(i)};animation-delay:${i*40}ms">
      <div class="absolute top-0 left-0 right-0 h-[3px]" style="background:${rankBar(i)}"></div>
      <div class="flex items-center gap-2 mb-1">
        <span class="text-lg">${medals[i] || `<span class="font-mono text-xs text-[#2a5080] font-bold">#${i+1}</span>`}</span>
        <span class="font-display text-3xl text-white tracking-wider">${esc(z.zip)}</span>
        <span class="font-mono text-xs text-[#3a6080] ml-1">${esc(z.city||'')}</span>
      </div>
      <p class="text-xs text-[#5a8090] leading-relaxed mb-3">${esc(z.thesis||'')}</p>
      <div class="flex flex-wrap gap-1.5 mb-2">
        ${(z.signals||[]).map(s=>`<span class="font-mono text-[10px] px-2 py-0.5 rounded-full" style="background:#061812;border:1px solid #1a4a35;color:#22d3a0">&#8593; ${esc(s)}</span>`).join('')}
      </div>
      ${z.riskFlag ? `<p class="font-mono text-[11px] text-[#d97706] mb-3">&#9888; ${esc(z.riskFlag)}</p>` : ''}
      <button onclick="addZip('${esc(z.zip)}')"
        class="w-full font-display text-sm tracking-wider py-2.5 rounded-lg text-black border-none cursor-pointer font-bold"
        style="background:linear-gradient(135deg,#0ea5e9,#22d3a0)">ANALYZE THIS MARKET &#8594;</button>
    </div>
  `).join('');
}

// ═══════════════════════════════════════════════════════════
// ANALYZE TAB
// ═══════════════════════════════════════════════════════════
function renderAnalyze() {
  const empty   = document.getElementById('analyze-empty');
  const content = document.getElementById('analyze-content');
  if (!empty) return;

  if (state.zips.length === 0) {
    empty.classList.remove('hidden');
    content.classList.add('hidden');
    return;
  }
  empty.classList.add('hidden');
  content.classList.remove('hidden');

  // Rankings
  const ranked = [...state.zips].filter(z=>state.results[z]?.scoring)
    .sort((a,b)=>state.results[b].scoring.composite - state.results[a].scoring.composite);
  document.getElementById('rankings-label').textContent = `RANKINGS -- ${state.strategy.toUpperCase()}`;
  document.getElementById('rankings-list').innerHTML = state.zips.map(z => {
    const r = state.results[z], rank = ranked.indexOf(z)+1, isA = z===state.activeZip, isL = state.loading[z];
    const rankColor = rank===1?'#f59e0b':rank<=3?'#22d3a0':rank<=7?'#38bdf8':'#132030';
    const score = r?.scoring?.composite;
    return `
      <div onclick="setActiveZip('${z}')"
        class="zip-row flex items-center gap-2 px-3 py-2.5 rounded-xl cursor-pointer transition-colors"
        style="background:${isA?'#0a1f35':'#090f1e'};border:1px solid ${isA?'#1e4060':'#121e30'}">
        <div class="w-5 h-5 rounded-full shrink-0 flex items-center justify-center font-mono text-[9px] font-bold"
          style="background:${rankColor};color:${rank&&rank<=7?'#000':'#2a4060'}">
          ${isL?'&middot;':rank||'?'}
        </div>
        <span class="font-display text-base tracking-wider flex-1 ${isA?'text-white':'text-[#4a7090]'}">${z}</span>
        ${score!=null?`<span class="font-display text-base" style="color:${sc(score)}">${score.toFixed(1)}</span>`:''}
        <button onclick="event.stopPropagation();removeZip('${z}')" class="bg-transparent border-none text-[#1e3050] cursor-pointer text-base p-0 ml-1">&times;</button>
      </div>`;
  }).join('');

  // Detail
  const panel = document.getElementById('detail-panel');
  const active = state.activeZip ? state.results[state.activeZip] : null;

  if (!active) {
    panel.innerHTML = `<div class="rounded-xl border border-[#121e30] bg-[#090f1e] p-10 text-center font-mono text-sm text-[#2a4060]">Select a ZIP from the rankings</div>`;
    return;
  }

  if (state.loading[state.activeZip]) {
    panel.innerHTML = `<div class="rounded-xl border border-[#121e30] bg-[#090f1e] p-10 text-center font-mono text-sm text-[#38bdf8]">Loading live data...</div>`;

async function fetchRedfin(id, file, label) {
  const btn = document.getElementById(`fetch-btn-${id}`);
  const msg = document.getElementById(`fetch-msg-${id}`);
  const bar = document.getElementById(`fetch-bar-${id}`);
  const setMsg = (m, color='#2a4060') => { msg.textContent=m; msg.style.color=color; };

  btn.textContent = '&#9211; FETCHING...'; btn.style.background='#0a1525';
  btn.style.color='#2a4060'; btn.style.border='1px solid #1a3050';
  bar.classList.remove('hidden');
  setMsg('Connecting to Redfin S3...');

  try {
    const s3url = REDFIN_BASE + file;
    const proxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(s3url)}`;
    setMsg('Downloading & decompressing...');
    const res = await fetch(proxy);
    if (!res.ok) throw new Error(`Proxy ${res.status}`);
    setMsg('Streaming data...');
    const ds = new DecompressionStream('gzip');
    const stream = res.body.pipeThrough(ds);
    const reader = stream.getReader();
    const dec = new TextDecoder();
    let text='', headers=null, rows=[], count=0;

    while (true) {
      const {done,value} = await reader.read();
      if (done) break;
      text += dec.decode(value, {stream:true});
      const lines = text.split('\n');
      text = lines.pop()||'';
      if (!headers && lines.length>0) {
        headers = lines.shift().split('\t').map(h=>h.trim().replace(/"/g,''));
      }
      for (const line of lines) {
        if (!line.trim()) continue;
        const vals = line.split('\t').map(v=>v.trim().replace(/"/g,''));
        const o={}; headers.forEach((h,i)=>{o[h]=vals[i]||'';});
        rows.push(o); count++;
        if (count%100===0) setMsg(`Streaming... ${count} rows`);
        if (count>=500) { reader.cancel(); break; }
      }
      if (rows.length>=500) break;
    }
    text += dec.decode();
    if (text.trim()) {
      const lines = text.split('\n').filter(l=>l.trim());
      for (const line of lines) {
        if (!headers) { headers=line.split('\t').map(h=>h.trim().replace(/"/g,'')); continue; }
        if (rows.length>=500) break;
        const vals=line.split('\t').map(v=>v.trim().replace(/"/g,''));
        const o={}; headers.forEach((h,i)=>{o[h]=vals[i]||'';});
        rows.push(o);
      }
    }
    if (rows.length===0) throw new Error('No data rows parsed');
    state.redfinData=rows; state.redfinFile=label;
    setMsg(`&#10003; ${rows.length} rows loaded`,'#22d3a0');
    btn.innerHTML='&#10003; LOADED'; btn.style.background='#0a2a18';
    btn.style.color='#22d3a0'; btn.style.border='1px solid #1a5030';
    updateTabBar();
    renderDataPreview();
    const banner=document.getElementById('data-loaded-banner');
    if(banner){banner.classList.remove('hidden');banner.style.display='flex';
      document.getElementById('data-loaded-name').textContent=label;
      document.getElementById('data-loaded-info').textContent=`${rows.length} rows loaded`;}
  } catch(e) {
    setMsg('Error: '+e.message,'#f87171');
    btn.innerHTML='&#9889; FETCH LIVE'; btn.style.background='linear-gradient(135deg,#0ea5e9,#22d3a0)';
    btn.style.color='#000'; btn.style.border='none';
  }
  bar.classList.add('hidden');
}

function handleFileUpload(e) {
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try {
      const lines=ev.target.result.trim().split('\n');
      const headers=lines[0].split('\t').map(h=>h.trim().replace(/"/g,''));
      const rows=lines.slice(1,501).map(l=>{
        const vals=l.split('\t').map(v=>v.trim().replace(/"/g,'')), o={};
        headers.forEach((h,i)=>{o[h]=vals[i]||'';});return o;
      });
      state.redfinData=rows; state.redfinFile=file.name;
      updateTabBar(); renderData();
    } catch(err){ alert('Parse error: '+err.message); }
  };
  reader.readAsText(file);
}

  state.apiTesting[id]=true; state.apiHealth[id]=null;
  renderAPI();
  try {
    let ok=false, msg='';
    if (id==='anthropic') { ok=true; msg='Connected via Claude.ai'; }
    else if (id==='fred') {
      const r=await fetch(`https://api.stlouisfed.org/fred/series?series_id=MORTGAGE30US&api_key=${KEYS.fred}&file_type=json`);
      ok=r.ok; msg=r.ok?'Connected':'Error '+r.status;
    } else if (id==='census') {
      const r=await fetch(`https://api.census.gov/data/2022/acs/acs5?get=NAME&for=state:06&key=${KEYS.census}`);
      ok=r.ok; msg=r.ok?'Connected':'Error '+r.status;
    } else if (id==='rentcast') {
      const r=await fetch('https://api.rentcast.io/v1/markets?zipCode=10001',{headers:{'X-Api-Key':KEYS.rentcast}});
      ok=r.ok; msg=r.ok?'Connected':'Error '+r.status;
    }
    state.apiHealth[id]={ok,msg};
  } catch(e) { state.apiHealth[id]={ok:false,msg:e.message}; }
  state.apiTesting[id]=false;
  renderAPI();
}

function testAllAPIs() {
  API_SOURCES.forEach(s=>testOneAPI(s.id));
}

// ═══════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════
(function init() {
  // Strategy pills
  const bar = document.getElementById('strategy-bar');
  Object.keys(STRATEGY_WEIGHTS).forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'strategy-btn shrink-0 font-mono text-xs font-bold px-3 py-1.5 rounded-md cursor-pointer border ' + (s===state.strategy?'active':'');
    btn.style.cssText = `background:${s===state.strategy?'#0a2a18':'#090f1e'};border-color:${s===state.strategy?'#22d3a0':'#1a2a40'};color:${s===state.strategy?'#22d3a0':'#2a5070'}`;
    btn.textContent = s;
    btn.dataset.strategy = s;
    btn.onclick = () => setStrategy(s);
    bar.appendChild(btn);
  });

  updateTabBar();
  renderPage();
})();
</script>
